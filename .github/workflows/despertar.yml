# Mantiene despierta la API en el horario de atención (RNF02, RNF13). En el plan gratuito, Render la duerme tras 15
# minutos sin solicitudes y el primer cliente espera cerca de un minuto. Este workflow consulta el catálogo cada 5
# minutos, lo que también mantiene despierta la base de Neon.
#
# Horario de atención en La Paz (UTC-4): lunes a sábado de 9:00 a 20:00 y domingo de 10:00 a 14:00. Empieza 10 minutos
# antes de abrir. GitHub puede retrasar unos minutos las tareas programadas, por eso consulta cada 5 y no cada 14.
# Usa la misma variable API_URL que el workflow del sitio web.
name: Despertar la API

on:
  schedule:
    - cron: '50,55 12 * * 1-6' # lunes a sábado, 8:50 y 8:55
    - cron: '*/5 13-23 * * 1-6' # lunes a sábado, de 9:00 a 19:55
    - cron: '50,55 13 * * 0' # domingo, 9:50 y 9:55
    - cron: '*/5 14-17 * * 0' # domingo, de 10:00 a 13:55
  workflow_dispatch:

permissions: {}

jobs:
  despertar:
    if: vars.API_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar el catálogo
        env:
          API_URL: ${{ vars.API_URL }}
        run: >-
          curl -fsS -o /dev/null --retry 3 --retry-delay 10 --retry-all-errors --max-time 90
          -w "HTTP %{http_code} en %{time_total} s\n" "$API_URL/api/catalogo/categorias"
