# Mantiene despierta la API en el horario de atención (RNF02, RNF13). En el plan gratuito, Render la duerme tras 15
# minutos sin solicitudes y el primer cliente espera cerca de un minuto. Este workflow consulta el catálogo cada 5
# minutos, lo que también mantiene despierta la base de Neon.
#
# Horario de atención en La Paz (UTC-4): lunes a sábado de 9:00 a 20:00 y domingo de 10:00 a 14:00. De lunes a sábado
# empieza a las 7:00, para la feria EXPOSOFT (25/11/2026, desde las 8:00).
#
# GitHub no garantiza las tareas programadas: omite la mayoría de las de cada 5 minutos. Para un día en que la API no se
# puede dormir, se inicia a mano (Actions → Despertar la API → Run workflow): una sola ejecución la consulta cada 5 minutos
# durante unas 10 horas, en dos turnos seguidos, porque un trabajo dura 6 horas como máximo.
# Usa la misma variable API_URL que el workflow del sitio web.
name: Despertar la API

on:
  schedule:
    - cron: '*/5 11-12 * * 1-6' # lunes a sábado, de 7:00 a 8:55
    - cron: '*/5 13-23 * * 1-6' # lunes a sábado, de 9:00 a 19:55
    - cron: '50,55 13 * * 0' # domingo, 9:50 y 9:55
    - cron: '*/5 14-17 * * 0' # domingo, de 10:00 a 13:55
  workflow_dispatch:

permissions: {}

jobs:
  despertar:
    if: vars.API_URL != '' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar el catálogo
        env:
          API_URL: ${{ vars.API_URL }}
        run: >-
          curl -fsS -o /dev/null --retry 3 --retry-delay 10 --retry-all-errors --max-time 90
          -w "HTTP %{http_code} en %{time_total} s\n" "$API_URL/api/catalogo/categorias"

  turno-1:
    if: vars.API_URL != '' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Consultar el catálogo cada 5 minutos, unas 5 horas
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          for vuelta in $(seq 1 60); do
            TZ=America/La_Paz date '+%H:%M en La Paz'
            curl -sS -o /dev/null --max-time 90 -w 'HTTP %{http_code} en %{time_total} s' "$API_URL/api/catalogo/categorias" || true
            echo
            sleep 300
          done

  turno-2:
    needs: turno-1
    if: vars.API_URL != '' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Consultar el catálogo cada 5 minutos, unas 5 horas
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          for vuelta in $(seq 1 60); do
            TZ=America/La_Paz date '+%H:%M en La Paz'
            curl -sS -o /dev/null --max-time 90 -w 'HTTP %{http_code} en %{time_total} s' "$API_URL/api/catalogo/categorias" || true
            echo
            sleep 300
          done
