# Respaldo diario de la base de Neon (RNF14). Cada noche copia la base, prueba restaurarla en un PostgreSQL vacío,
# compara las filas de cada tabla y guarda la copia cifrada con AES-256 durante 90 días como artefacto de la
# ejecución. El repositorio es público: sin la clave, la copia no se puede leer. El trabajo está en
# .github/scripts/respaldo.sh.
#
# Secrets del repositorio (Settings → Secrets and variables → Actions → Secrets):
#   RESPALDO_DB_URL  la cadena de conexión directa de Neon, tal cual la muestra Connect (postgresql://…)
#   RESPALDO_CLAVE   la frase que cifra las copias. Guárdenla también fuera de GitHub: sin ella no se restaura nada.
name: Respaldo diario

on:
  schedule:
    - cron: '0 7 * * *' # 03:00 en La Paz (UTC-4)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: respaldo
  cancel-in-progress: false

jobs:
  respaldar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Base vacía donde se prueba cada restauración; desaparece al terminar.
      prueba:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: prueba
          POSTGRES_DB: restauracion
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      ORIGEN_URL: ${{ secrets.RESPALDO_DB_URL }}
      RESPALDO_CLAVE: ${{ secrets.RESPALDO_CLAVE }}
      PRUEBA_URL: postgresql://postgres:prueba@localhost:5432/restauracion
      PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - name: Comprobar los secrets
        run: |
          if [ -z "$ORIGEN_URL" ] || [ -z "$RESPALDO_CLAVE" ]; then
            echo "::error::Faltan los secrets RESPALDO_DB_URL o RESPALDO_CLAVE (README, «Respaldo diario»)."
            exit 1
          fi

      - uses: actions/checkout@v4

      # El cliente debe ser de la misma versión que el servidor o más nuevo; el 18 sirve para Neon 17 o 18.
      - name: Cliente de PostgreSQL 18
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-18

      - name: Copiar, probar la restauración y cifrar
        id: respaldo
        run: |
          fecha=$(TZ=America/La_Paz date +%Y-%m-%d)
          echo "fecha=$fecha" >> "$GITHUB_OUTPUT"
          ARCHIVO="dulces-aromas-$fecha.dump.gpg" bash .github/scripts/respaldo.sh

      - name: Guardar la copia cifrada
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ steps.respaldo.outputs.fecha }}
          path: dulces-aromas-*.dump.gpg
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
