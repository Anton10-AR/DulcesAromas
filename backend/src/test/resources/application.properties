spring.datasource.url=jdbc:h2:mem:dulces_aromas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jackson.time-zone=America/La_Paz
spring.flyway.clean-disabled=false
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB
seguridad.cors.origenes=http://localhost:8081
