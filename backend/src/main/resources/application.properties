spring.application.name=dulces-aromas

# Las credenciales vienen de variables de entorno o de backend/.env (no se versiona).
spring.config.import=optional:file:.env[.properties]
# Los servicios en la nube indican el puerto con PORT.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dulces_aromas}
spring.datasource.username=${DB_USER:dulces_aromas}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo maneja Flyway (src/main/resources/db/migration); Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Carga en lotes las relaciones de varias filas, para no hacer una consulta por producto.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.jackson.time-zone=America/La_Paz

# Primer administrador: se crea al arrancar solo si no hay ninguno activo.
seguridad.administrador-inicial.nombre=${ADMIN_NOMBRE:Administrador}
seguridad.administrador-inicial.correo=${ADMIN_CORREO:}
seguridad.administrador-inicial.contrasena=${ADMIN_CONTRASENA:}

# Cada archivo se valida en su servicio (imágenes 10 MB, RNF10; comprobantes 5 MB, RNF09); este límite solo corta
# archivos mucho mayores.
spring.servlet.multipart.max-file-size=11MB
spring.servlet.multipart.max-request-size=11MB

# Correo para recuperar la contraseña (CU12). Sin MAIL_HOST, el correo se escribe en el registro (solo desarrollo).
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PUERTO:587}
spring.mail.username=${MAIL_USUARIO:}
spring.mail.password=${MAIL_CONTRASENA:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
seguridad.recuperacion.remitente=${MAIL_REMITENTE:no-responder@dulcesaromas.bo}
# En la nube, donde suelen bloquear SMTP (como el plan gratuito de Render), el correo sale por la API de Brevo.
seguridad.recuperacion.brevo-clave=${BREVO_CLAVE:}
# Pantalla de la app que recibe el enlace; se le agrega ?token=...
seguridad.recuperacion.enlace=${RECUPERACION_URL:http://localhost:8081/recuperar}

# Orígenes del Panel web que pueden llamar a la API desde el navegador, separados por comas.
seguridad.cors.origenes=${CORS_ORIGENES:http://localhost:8081}
