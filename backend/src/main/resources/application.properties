spring.application.name=dulces-aromas

# Las credenciales vienen de variables de entorno o de backend/.env (no se versiona).
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dulces_aromas}
spring.datasource.username=${DB_USER:dulces_aromas}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo maneja Flyway (src/main/resources/db/migration); Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.jackson.time-zone=America/La_Paz

# Primer administrador: se crea al arrancar solo si no hay ninguno activo.
seguridad.administrador-inicial.nombre=${ADMIN_NOMBRE:Administrador}
seguridad.administrador-inicial.correo=${ADMIN_CORREO:}
seguridad.administrador-inicial.contrasena=${ADMIN_CONTRASENA:}
